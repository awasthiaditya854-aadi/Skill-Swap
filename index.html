<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillSwap — Learn. Teach. Swap.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0a0d18;
      color: #f6f7fb;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    /* SIDEBAR */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 250px;
      background: #101421;
      border-right: 1px solid #242a3b;
      padding: 24px 15px;
      overflow-y: auto;
      z-index: 10;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .brand span {
      display: inline-grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 11px;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      margin-right: 7px;
    }

    .tagline {
      color: #7f8aa3;
      font-size: 12px;
      margin: 6px 0 20px 43px;
    }

    .sidebar nav {
      display: grid;
      gap: 5px;
    }

    .nav {
      background: transparent;
      color: #aeb7ca;
      text-align: left;
      padding: 11px 12px;
      border-radius: 11px;
      transition: 0.2s;
    }

    .nav:hover,
    .nav.active {
      background: #1c2233;
      color: white;
    }

    .nav.active {
      box-shadow: inset 3px 0 #8b5cf6;
    }

    /* MAIN */

    main {
      margin-left: 250px;
      min-height: 100vh;
    }

    header {
      height: 82px;
      padding: 17px 35px;
      border-bottom: 1px solid #202638;
      background: rgba(10, 13, 24, 0.9);
      backdrop-filter: blur(15px);

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: sticky;
      top: 0;
      z-index: 5;
    }

    .eyebrow {
      font-size: 10px;
      color: #8d99b3;
      letter-spacing: 2px;
      margin: 0 0 3px;
    }

    header h2 {
      margin: 0;
      font-size: 20px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      position: relative;
      background: #171d2c;
      color: white;
      border: 1px solid #2a3144;
      border-radius: 12px;
      width: 42px;
      height: 42px;
    }

    .icon-btn b {
      position: absolute;
      right: -3px;
      top: -4px;
      background: #f43f5e;
      border-radius: 99px;
      font-size: 9px;
      padding: 3px 5px;
    }

    .profile-mini {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      font-weight: 800;
    }

    .mobile-menu {
      display: none;
    }

    /* CONTENT */

    .content {
      padding: 34px;
      max-width: 1450px;
      margin: auto;
    }

    /* HERO */

    .hero {
      position: relative;
      overflow: hidden;

      padding: 42px;

      border: 1px solid #292f44;
      border-radius: 25px;

      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(34, 211, 238, 0.15),
          transparent 28%
        ),
        radial-gradient(
          circle at 15% 90%,
          rgba(139, 92, 246, 0.16),
          transparent 30%
        ),
        #111625;
    }

    .hero h1 {
      font-size: clamp(35px, 5vw, 62px);
      line-height: 0.98;
      max-width: 700px;
      margin: 10px 0 18px;
      letter-spacing: -2.5px;
    }

    .hero h1 span {
      background: linear-gradient(
        90deg,
        #a78bfa,
        #22d3ee,
        #f472b6
      );

      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      color: #aeb7ca;
      max-width: 610px;
      line-height: 1.6;
    }

    /* SEARCH */

    .searchbar {
      display: flex;
      gap: 10px;
      max-width: 650px;
      margin-top: 25px;
    }

    .searchbar input,
    .field input,
    .field select {
      flex: 1;

      background: #0b0f1c;
      border: 1px solid #30374c;

      color: white;

      padding: 14px 16px;

      border-radius: 13px;
      outline: none;
    }

    .primary {
      background: linear-gradient(
        135deg,
        #8b5cf6,
        #6366f1
      );

      color: white;

      padding: 13px 18px;

      border-radius: 12px;

      font-weight: 700;

      box-shadow:
        0 10px 30px rgba(99, 102, 241, 0.2);
    }

    .secondary {
      background: #1b2232;
      color: #dbe2f0;

      border: 1px solid #30384d;

      padding: 11px 15px;

      border-radius: 11px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 20px 0;
    }

    .stat,
    .card {
      background: #111624;
      border: 1px solid #252c40;
      border-radius: 17px;
      padding: 19px;
    }

    .stat .num {
      font-size: 26px;
      font-weight: 800;
    }

    /* GENERAL */

    .muted {
      color: #8590a8;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;

      margin: 30px 0 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 21px;
    }

    .grid,
    .people {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    /* PEOPLE */

    .person {
      position: relative;
    }

    .avatar {
      width: 50px;
      height: 50px;

      border-radius: 15px;

      display: grid;
      place-items: center;

      background: linear-gradient(
        135deg,
        #334155,
        #8b5cf6
      );

      font-weight: 800;
    }

    .person-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .match {
      display: inline-block;

      color: #67e8f9;

      background: rgba(34, 211, 238, 0.09);

      border: 1px solid rgba(34, 211, 238, 0.2);

      padding: 4px 8px;

      border-radius: 20px;

      font-size: 11px;

      margin-top: 8px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 14px 0;
    }

    .chip {
      font-size: 11px;

      padding: 6px 9px;

      border-radius: 20px;

      background: #1a2030;

      color: #bac4d8;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .actions button {
      flex: 1;
    }

    /* PAGE */

    .page-head {
      margin-bottom: 22px;
    }

    .page-head h1 {
      font-size: 34px;
      margin-bottom: 6px;
    }

    .page-head p {
      color: #8d99b3;
    }

    /* PROGRESS */

    .progress {
      height: 8px;

      background: #222a3c;

      border-radius: 20px;

      overflow: hidden;

      margin: 10px 0;
    }

    .progress i {
      display: block;

      height: 100%;

      background: linear-gradient(
        90deg,
        #8b5cf6,
        #22d3ee
      );

      border-radius: 20px;
    }

    /* BADGE */

    .badge {
      display: inline-block;

      padding: 5px 9px;

      border-radius: 9px;

      background: #27203d;

      color: #c4b5fd;

      font-size: 11px;
    }

    /* TEST */

    .score {
      font-size: 40px;
      font-weight: 900;

      background: linear-gradient(
        90deg,
        #a78bfa,
        #22d3ee
      );

      -webkit-background-clip: text;
      color: transparent;
    }

    .question {
      padding: 15px;

      background: #191f2f;

      border-radius: 13px;

      margin: 10px 0;
    }

    .option {
      display: block;

      width: 100%;

      text-align: left;

      margin: 7px 0;

      padding: 11px;

      border-radius: 10px;

      background: #0d1220;

      color: #dbe2f0;

      border: 1px solid #293248;
    }

    .option:hover {
      border-color: #8b5cf6;
    }

    /* LEADERBOARD */

    .leader {
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 13px 0;

      border-bottom: 1px solid #242b3c;
    }

    .rank {
      width: 28px;
      font-weight: 800;
      color: #aeb7ca;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.7);

      display: grid;
      place-items: center;

      padding: 20px;

      z-index: 30;
    }

    .hidden {
      display: none;
    }

    .modal-card {
      position: relative;

      width: min(650px, 100%);

      max-height: 90vh;

      overflow: auto;

      background: #121827;

      border: 1px solid #30384d;

      border-radius: 20px;

      padding: 28px;
    }

    .close {
      position: absolute;

      right: 15px;
      top: 12px;

      background: transparent;

      color: #aeb7ca;

      font-size: 28px;
    }

    /* FORM */

    .field {
      display: grid;
      gap: 7px;
      margin: 13px 0;
    }

    .field label {
      font-size: 12px;
      color: #aeb7ca;
    }

    /* NOTE */

    .note {
      padding: 13px 15px;

      background: #171e2d;

      border-left: 3px solid #8b5cf6;

      border-radius: 10px;

      color: #b8c2d7;
    }

    /* CERTIFICATE */

    .certificate {
      border: 1px solid #8b5cf6;

      border-radius: 16px;

      padding: 30px;

      text-align: center;

      background:
        radial-gradient(
          circle,
          #251c43,
          #111624 60%
        );
    }

    /* TOAST */

    #toast {
      position: fixed;

      right: 20px;
      bottom: 20px;

      background: #1b2232;

      border: 1px solid #39435a;

      padding: 13px 16px;

      border-radius: 12px;

      z-index: 50;

      opacity: 0;

      transform: translateY(15px);

      transition: 0.25s;
    }

    #toast.show {
      opacity: 1;
      transform: none;
    }

    /* RESPONSIVE */

    @media (max-width: 950px) {

      .sidebar {
        transform: translateX(-100%);
        transition: 0.25s;
      }

      .sidebar.open {
        transform: none;
      }

      main {
        margin-left: 0;
      }

      .mobile-menu {
        display: block;

        background: #171d2c;

        color: white;

        border-radius: 9px;

        padding: 9px;
      }

      header {
        justify-content: flex-start;
        gap: 10px;
      }

      .header-actions {
        margin-left: auto;
      }

      .grid,
      .people {
        grid-template-columns: 1fr 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {

      .content {
        padding: 18px;
      }

      .hero {
        padding: 25px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .searchbar {
        flex-direction: column;
      }

      .grid,
      .people,
      .stats {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

    // ===============================
    // USER DATA
    // ===============================

    let state = JSON.parse(
      localStorage.getItem("skillSwapState") ||
      `{
        "coins":240,
        "streak":7,
        "swaps":3,
        "tests":2,
        "learned":5,
        "taught":4,
        "verified":2,
        "requests":[]
      }`
    );


    // ===============================
    // HELPERS
    // ===============================

    const app = document.getElementById("app");
    const title = document.getElementById("pageTitle");

    function save() {

      localStorage.setItem(
        "skillSwapState",
        JSON.stringify(state)
      );

    }


    function toast(message) {

      const t = document.getElementById("toast");

      t.className = "show";

      t.textContent = message;

      setTimeout(() => {

        t.className = "";

      }, 2200);

    }


    function go(page) {

      document
        .querySelectorAll(".nav")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.page === page
          );

        });

      render(page);

      document
        .querySelector(".sidebar")
        .classList.remove("open");

    }


    function toggleSidebar() {

      document
        .querySelector(".sidebar")
        .classList.toggle("open");

    }


    function openModal(html) {

      document.getElementById("modalBody").innerHTML = html;

      document
        .getElementById("modal")
        .classList.remove("hidden");

    }


    function closeModal() {

      document
        .getElementById("modal")
        .classList.add("hidden");

    }


    // ===============================
    // STUDENT CARD
    // ===============================

    function personCard(student) {

      return `

        <div class="card person">

          <div class="person-top">

            <div class="avatar">
              ${student.initial}
            </div>

            <div>

              <h3>${student.name}</h3>

              <span class="muted">
                ${student.level} • ⭐ ${student.rating}
              </span>

            </div>

          </div>

          <span class="match">
            ${student.match}% match
          </span>

          <div class="chips">

            <span class="chip">
              Teaches: ${student.teach}
            </span>

            <span class="chip">
              Wants: ${student.want}
            </span>

          </div>

          <small class="muted">
            🕐 ${student.time}
          </small>

          <div class="actions">

            <button
              class="primary"
              onclick='startSwap(${JSON.stringify(student)})'>
              Start Swap
            </button>

            <button
              class="secondary"
              onclick='viewProfile(${JSON.stringify(student)})'>
              Profile
            </button>

          </div>

        </div>

      `;
    }


    // ===============================
    // SKILL SWAP
    // ===============================

    function startSwap(student) {

      openModal(`

        <h2>
          🤝 Skill Swap with ${student.name}
        </h2>

        <p class="muted">
          AI found a ${student.match}% compatible exchange.
        </p>

        <div class="note">

          You learn
          <b>${student.teach}</b>
          from ${student.name}

          →

          ${student.name}
          learns
          <b>${student.want}</b>
          from you.

        </div>

        <h3>Suggested session</h3>

        <p>

          10 min • Introductions & goals<br>
          20 min • ${student.teach} teaching<br>
          20 min • Your skill: ${student.want}<br>
          10 min • Practice + feedback

        </p>

        <button
          class="primary"
          onclick="confirmSwap('${student.name}')">

          Send Swap Request

        </button>

      `);

    }


    function confirmSwap(name) {

      state.swaps++;

      state.coins += 10;

      save();

      closeModal();

      toast(
        `Swap request sent to ${name}! +10 SkillCoins`
      );

      go("swap");

    }


    // ===============================
    // PROFILE MODAL
    // ===============================

    function viewProfile(student) {

      openModal(`

        <h2>${student.name}</h2>

        <p class="muted">
          CSE Student • ⭐ ${student.rating}
        </p>

        <div class="chips">

          <span class="chip">
            🎓 ${student.level}
          </span>

          <span class="chip">
            🕐 ${student.time}
          </span>

          <span class="chip">
            ✨ ${student.match}% Match

    function takeTest(skill) {

      const questions =
        tests[skill].questions;

      let current = 0;

      let score = 0;


      function showQuestion() {

        const question =
          questions[current];

        openModal(`

          <span class="badge">

            ${skill} TEST

            • ${current + 1}/${questions.length}

          </span>

          <h2>
            ${question[0]}
          </h2>

          ${question[1]
            .map(
              (option, index) => `

                <button
                  class="option"
                  onclick="
                    answer(
                      ${index},
                      ${question[2]},
                      '${skill}'
                    )
                  ">

                  ${option}

                </button>

              `
            )
            .join("")}

        `);

      }


      window.answer =
        function(chosen, correct, skillName) {

          if (chosen === correct) {

            score++;

          }

          current++;


          if (current < questions.length) {

            showQuestion();

          }

          else {

            state.tests++;

            state.coins += 20;


            if (score >= 2) {

              state.verified++;

            }


            save();


            openModal(`

              <div style="text-align:center">

                <div class="score">

                  ${Math.round(
                    score /
                    questions.length *
                    100
                  )}%

                </div>

                <h2>

                  ${
                    score >= 2
                      ? "🎉 Skill Verified!"
                      : "Keep Practicing!"
                  }

                </h2>

                <p>

                  You scored
                  <b>
                    ${score}/${questions.length}
                  </b>

                  in ${skillName}.

                </p>

                <p>
                  🪙 +20 SkillCoins
                </p>

                <button
                  class="primary"
                  onclick="
                    closeModal();
                    go('tests')
                  ">

                  Done

                </button>

              </div>

            `);

          }

        };


      showQuestion();

    }

                </div>

              `
            )
            .join("")}

        </div>

      `;

    }


    // ===============================
    // PROGRESS
    // ===============================

    function progress() {

      title.textContent =
        "My Progress";

      const skills = [

        ["Python", 80],
        ["DSA", 65],
        ["UI/UX", 55],
        ["Communication", 72]

      ];


      app.innerHTML = `

        <div class="page-head">

          <h1>
            📈 My Progress
          </h1>

          <p>
            Track your learning growth.
          </p>

        </div>


        <div class="grid">

          ${skills
            .map(
              skill => `

                <div class="card">

                  <h3>
                    ${skill[0]}
                  </h3>

                  <div class="progress">

                    <i
                      style="
                        width:${skill[1]}%
                      ">
                    </i>

                  </div>

                  <b>
                    ${skill[1]}% verified
                  </b>

                  <p class="muted">
                    Last activity: this week
                  </p>

                </div>

              `
            )
            .join("")}

        </div>


        <div
          class="card"
          style="margin-top:15px">

          <h3>
            📂 Learning History
          </h3>

          <p>
            Python SkillSwap — Completed ✓
          </p>

          <p>
            DSA SkillSwap — Completed ✓
          </p>

          <p>
            JavaScript SkillSwap — Completed ✓
          </p>

        </div>

      `;

    }


    // ===============================
    // ACHIEVEMENTS
    // ===============================

    function achievements() {

      title.textContent =
        "Achievements";

      const achievementsList = [

        [
          "🤝",
          "First Swap",
          "Complete your first exchange",
          true
        ],

        [
          "🪙",
          "Coin Collector",
          "Earn 200 SkillCoins",
          true
        ],

        [
          "🔥",
          "7 Day Streak",
          "Learn for 7 days",
          true
        ],

        [
          "🏅",
          "Test Master",
          "Pass 3 skill tests",
          state.tests >= 3
        ],

        [
          "🎓",
          "Great Teacher",
          "Teach 5 students",
          state.taught >= 5
        ],

        [
          "🌟",
          "Top Rated",
          "Get 5 five-star reviews",
          false
        ]

      ];


      app.innerHTML = `

        <div class="page-head">

          <h1>
            🎖️ Achievements
          </h1>

          <p>
            Collect badges as you contribute.
          </p>

        </div>


        <div class="grid">

          ${achievementsList
            .map(
              achievement => `

                <div class="card">

                  <div style="font-size:34px">

                    ${achievement[0]}

                  </div>

                  <h3>

                    ${achievement[1]}

                    ${achievement[3] ? "✓" : ""}

                  </h3>

                  <p class="muted">

                    ${achievement[2]}

                  </p>

                  <span class="badge">

                    ${
                      achievement[3]
                        ? "UNLOCKED"
                        : "LOCKED"
                    }

                  </span>

                </div>

              `
            )
            .join("")}

        </div>

      `;

    }


    // ===============================
    // PROFILE
    // ===============================

    function profile() {

      title.textContent =
        "Profile";

      app.innerHTML = `

        <div class="page-head">

          <h1>
            👤 My Profile
          </h1>

          <p>
            Your SkillSwap identity.
          </p>

        </div>


        <div class="grid">


          <div class="card">

            <div class="person-top">

              <div class="avatar">
                AS
              </div>

              <div>

                <h2 style="margin:0">
                  Aditya Sharma
                </h2>

                <span class="muted">
                  CSE Student • ⭐ 4.8
                </span>

              </div>

            </div>


            <div class="chips">

              <span class="chip">
                🔥 ${state.streak}-day streak
              </span>

              <span class="chip">
                🪙 ${state.coins} coins
              </span>

            </div>


            <h3>
              Skills I teach
            </h3>

            <p>
              Python • C++ • HTML/CSS
            </p>


            <h3>
              Skills I want
            </h3>

            <p>
              DSA • AI/ML • React
            </p>

          </div>


          <div class="card">

            <h3>
              🏅 Verified Skills
            </h3>

            <p>
              🐍 Python <b>80%</b> ✓
            </p>

            <p>
              ⚡ DSA <b>65%</b>
            </p>

            <p>
              🎨 UI/UX <b>55%</b>
            </p>

            <hr style="border-color:#252c40">

            <h3>
              📊 Activity
            </h3>

            <p>
              ${state.swaps} swaps •
              ${state.tests} tests •
              ${state.taught} taught
            </p>

          </div>


          <div class="card">

            <h3>
              📂 Your Custom Skills
            </h3>

            ${
              state.requests.length

                ? state.requests
                    .map(
                      request => `

                        <p>

                          ${
                            request.type === "offer"
                              ? "🎓"
                              : "📚"
                          }

                          ${request.skill}

                        </p>

                      `
                    )
                    .join("")

                : `
                  <p class="muted">
                    No custom skills yet.
                  </p>
                `
            }

          </div>

        </div>


        <div
          style="margin-top:18px"
          class="certificate">

          <h2>
            📜 SkillSwap Certificate
          </h2>

          <p>
            Complete a swap and pass its test
            to unlock your certificate.
          </p>

          <button
            class="primary"
            onclick="certificate()">

            View Certificate

          </button>

        </div>

      `;

    }


    // ===============================
    // CERTIFICATE
    // ===============================

    function certificate() {

      openModal(`

        <div class="certificate">

          <div style="font-size:45px">
            🏅
          </div>

          <h1>
            Certificate of Skill Exchange
          </h1>

          <p>
            This certifies that
          </p>

          <h2>
            Aditya Sharma
          </h2>

          <p>
            successfully participated
            in the SkillSwap community.
          </p>

          <span class="badge">
            SKILLSWAP VERIFIED LEARNER
          </span>

        </div>

      `);

    }


    // ===============================
    // NOTIFICATIONS
    // ===============================

    function showNotifications() {

      openModal(`

        <h2>
          🔔 Notifications
        </h2>

        <div class="note">

          🤝 Rahul accepted your
          swap request.

        </div>

        <br>

        <div class="note">

          📝 Your Python test is ready.

        </div>

        <br>

        <div class="note">

          🏆 You moved up 4 places
          on the leaderboard.

        </div>

      `);


      document.getElementById(
        "notifDot"
      ).style.display = "none";

    }


    // ===============================
    // PAGE ROUTER
    // ===============================

    const pages = {

      home,

      discover,

      matches,

      offer:
        () => formPage("offer"),

      request,

      swap,

      tests:
        testsPage,

      challenges,

      community,

      chat,

      schedule,

      coins,

      leaderboard,

      progress,

      achievements,

      profile

    };


    function render(page = "home") {

      if (pages[page]) {

        pages[page]();

      }

    }


    // ===============================
    // NAVIGATION
    // ===============================

    document
      .querySelectorAll(".nav")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            go(button.dataset.page);

          }
        );

      });


    // START WEBSITE

    render("home");

  </script>

</body>
</html>
